[project]
name = "gira-home-assistant"
version = "0.1.0"
description = "Home Assistant integration for the Gira HomeServer"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.ty.rules]
invalid-property-type-override = "ignore"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
